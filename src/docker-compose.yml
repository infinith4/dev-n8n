services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Tokyo
      # Allow using $env.* in expressions and JS nodes (n8n v2+ blocks this by default).
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Phase 1: Sheets -> intermediate export file
      - WBS_SHEET_ID=${WBS_SHEET_ID}
      - WBS_SHEET_NAME=${WBS_SHEET_NAME}
      - WBS_SHEET_RANGE=${WBS_SHEET_RANGE}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8npassword
    links:
      - postgres
    volumes:
      - n8n_data:/home/node/.n8n
      # Intermediate export outputs (JSON/CSV) generated by workflows
      # Use a stable path that works whether compose is launched from repo root (devcontainer)
      # or from `src/` directly.
      - ../src/data/exports:/exports
    depends_on:
      - postgres
    restart: always

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8npassword
      - POSTGRES_DB=n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  n8n_data:
  postgres_data:
